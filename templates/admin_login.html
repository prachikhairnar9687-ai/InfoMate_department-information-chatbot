{% extends "base.html" %}

{% block title %}Admin Sign In | InfoMate{% endblock %}

{% block content %}

<div class="auth">
    <section class="card auth-card">
        <h1>Admin sign in</h1>
        <p class="sub">Use your department administrator account.</p>

        <form method="post" action="/admin/login">
            <label for="email">Email address</label>
            <input id="email" type="email" name="email" required autocomplete="username" autofocus>

            <label for="password">Password</label>
            <input id="password" type="password" name="password" required autocomplete="current-password">

            <button class="btn btn-primary btn-block" type="submit">Sign in</button>
        </form>

        <p class="note">
            Administrator accounts are provisioned by the Super Admin.
            Public registration is disabled.
        </p>
    </section>
</div>

{% endblock %}
